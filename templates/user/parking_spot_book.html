{% extends "user/user_base.html" %}
{% block title %}Book | Parking Spot{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="card mx-auto shadow-sm" style="max-width: 480px;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Book Parking Spot @ {{ data.prime_location_name }}</h5>
        </div>
        <div class="card-body">
            <form action="/user/parking-spot/book/{{ data.user_id }}/{{ data.lot_id }}" method="POST">
                <div class="mb-3">
                    <label for="user_id" class="form-label">User ID</label>
                    <input type="number" id="user_id" name="user_id" class="form-control" value="{{ data.user_id }}" disabled>
                </div>
                <div class="mb-3">
                    <label for="lot_id" class="form-label">Lot ID</label>
                    <input type="number" id="lot_id" name="lot_id" class="form-control" value="{{ data.lot_id }}" disabled>
                </div>
                <div class="mb-3">
                    <label for="spot_id" class="form-label">Spot ID</label>
                    <input type="number" id="spot_id" name="spot_id" class="form-control" value="{{ data.id }}" disabled>
                </div>
                <div class="mb-4">
                    <label for="vehicle_num" class="form-label">Vehicle Number</label>
                    <input type="text" id="vehicle_num" name="vehicle_num" class="form-control" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/user/dashboard/{{ data.user_id }}" class="btn btn-outline-secondary w-50 me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary w-50">Reserve</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
