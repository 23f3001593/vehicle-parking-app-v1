<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="/user/dashboard/{{ data.user_id }}">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="ParkZone" class="header-logo" />
                </a>
                <div class="ms-auto d-flex align-items-center">
                    <a href="/user/dashboard/{{ data.user_id }}" class="btn me-2 {% if request.path.startswith('/user/dashboard') %}btn-primary{% else %}btn-outline-light{% endif %}">Home</a>
                    <a href="/user/parking-history/{{ data.user_id }}" class="btn me-2 {% if request.path.startswith('/user/parking-history') %}btn-primary{% else %}btn-outline-light{% endif %}">History</a>
                    <div class="dropdown ms-3">
                        <a class="text-white d-flex align-items-center text-decoration-none dropdown-toggle" href="#" role="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false" title="Profile">
                            <i class="bi bi-person-circle fs-4 me-2"></i>
                            <span class="d-none d-md-inline">{{ current_user.full_name }}</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-start" aria-labelledby="profileDropdown">
                            <li><a class="dropdown-item" href="/user/edit/{{ data.user_id }}">Edit Profile</a></li>
                            <li><a class="dropdown-item" href="/logout">Logout</a></li>
                            <li><a class="dropdown-item text-danger" href="/user/delete/{{ data.user_id }}">Delete Account</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <main>
            {% block content %}{% endblock %}
        </main>
        <footer>
            <div class="container">
                &copy; 2025 ParkZone. All rights reserved.
            </div>
        </footer>
        {% if message %}
            <div id="error-message" data-message="{{ message | e }}"></div>
        {% endif %}
        <script src="{{ url_for('static', filename='error-handler.js') }}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    </body>
</html>
