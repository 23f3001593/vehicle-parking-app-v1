<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>{% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="/">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="ParkZone" class="header-logo" />
                </a>
                <a href="/" class="text-white ms-3 d-flex align-items-center text-decoration-none home-icon-link" title="Home">
                    <i class="bi bi-house-door-fill fs-4"></i>
                </a>
            </div>
        </nav>
        {% block content %}{% endblock %}
        <footer>
            <div class="container">
                &copy; 2025 ParkZone. All rights reserved.
            </div>
        </footer>
    </body>
</html>
