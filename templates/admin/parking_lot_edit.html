{% extends "admin/admin_base.html" %}
{% block title %}Edit | Parking Lot{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="card mx-auto shadow-sm" style="max-width: 480px;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Edit Parking Lot</h5>
        </div>
        <div class="card-body">
            <form action="/admin/parking-lot/edit/{{ lot.id }}" method="POST">
                <div class="mb-3">
                    <label for="prime_location_name" class="form-label">Prime Location Name</label>
                    <input type="text" id="prime_location_name" name="prime_location_name" class="form-control" value="{{ lot.prime_location_name }}" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea id="address" name="address" rows="4" class="form-control" required>{{ lot.address }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="pincode" class="form-label">Pin Code</label>
                    <input type="text" id="pincode" name="pincode" class="form-control" value="{{ lot.pincode }}" required>
                </div>
                <div class="mb-3">
                    <label for="price" class="form-label">Price (per hour)</label>
                    <input type="number" id="price" name="price" class="form-control" value="{{ '%.2f' %  lot.price }}" required>
                </div>
                <div class="mb-4">
                    <label for="max_spots" class="form-label">Maximum Spots</label>
                    <input type="number" id="max_spots" name="max_spots" class="form-control" value="{{ lot.max_spots }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/admin/dashboard" class="btn btn-outline-secondary w-50 me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary w-50">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
