<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>Registered Users</title>
    </head>
    <body>
        <div>
            <h3>
                <a href="/admin/dashboard">Home | </a>
                <a href="/admin/registered-users">Users | </a>
                <a href="/">Logout</a>
            </h3>
        </div>
        <h1>Registered Users</h1>
        <table id = "registered-users" border="1" cellpadding="5" cellspacing="0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Fullname</th>
                    <th>Address</th>
                    <th>Pincode</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{user.id}}</td>
                        <td>{{user.user_name}}</td>
                        <td>{{user.full_name}}</td>
                        <td>{{user.address}}</td>
                        <td>{{user.pincode}}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </body>
</html>
