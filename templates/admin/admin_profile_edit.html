{% extends "admin/admin_base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="card mx-auto shadow-sm" style="max-width: 480px;">
        <div class="card-header bg-primary text-white text-center">
            <h5 class="mb-0">Edit Profile</h5>
        </div>
        <div class="card-body">
            <form action="/admin/edit" method="POST">
                <div class="mb-3">
                    <label for="user_id" class="form-label">Admin ID</label>
                    <input type="number" id="user_id" name="user_id" class="form-control" value="{{ data.user_id }}" disabled>
                </div>
                <div class="mb-3">
                    <label for="user_name" class="form-label">Username</label>
                    <input type="text" id="user_name" name="user_name" class="form-control" value="{{ data.user_name }}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="text" id="password" name="password" class="form-control" value="{{ data.password }}" required>
                </div>
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" value="{{ data.full_name }}" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <textarea id="address" name="address" class="form-control" rows="4" required>{{ data.address }}</textarea>
                </div>
                <div class="mb-4">
                    <label for="pincode" class="form-label">Pincode</label>
                    <input type="text" id="pincode" name="pincode" class="form-control" value="{{ data.pincode }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="/admin/dashboard" class="btn btn-outline-secondary w-50 me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary w-50">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
